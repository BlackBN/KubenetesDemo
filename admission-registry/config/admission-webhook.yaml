
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    app.kubernetes.io/instance: admission-registry
    app.kubernetes.io/name: admission-registry
  name: admission-registry
webhooks:
- admissionReviewVersions: ["v1"]
  clientConfig:
    caBundle: 
    service:
      name: admission-registry
      namespace: waf
      path: /validate
      port: 443
  name: bnblak.com.admissiono-registry
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE","UPDATE"]
    resources: ["pods"]
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10

---

apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    app.kubernetes.io/instance: admission-registry
    app.kubernetes.io/name: admission-registry
  name: admission-registry
webhooks:
- admissionReviewVersions: ["v1"]
  clientConfig:
    caBundle: 
    service:
      name: admission-registry
      namespace: waf
      path: /mutate
      port: 443
  name: bnblak.com.admissiono-registry
  rules:
  - apiGroups: ["apps",""]
    apiVersions: ["v1"]
    operations: ["CREATE","UPDATE"]
    resources: ["deployments","services"]
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
